<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Operaton BPMN Editor</title>
    </head>
    <body class="desktop">
        <main class="content with-diagram" id="js-drop-zone">
            <div class="canvas" id="js-canvas"></div>
            <aside class="properties-panel-parent" id="js-properties-panel"></aside>
        </main>
        <div class="desktop-status" id="desktop-status" role="status" aria-live="polite">
            <div class="desktop-status-state">
                <span class="desktop-status-dot" aria-hidden="true"></span>
                <span class="desktop-status-label"></span>
            </div>
            <div class="desktop-status-filename"></div>
        </div>
        <aside
            class="desktop-shortcuts-help"
            id="desktop-shortcuts-help"
            aria-label="Keyboard shortcuts"
            hidden
        >
            <h2>Keyboard shortcuts</h2>
            <dl>
                <div>
                    <dt>Ctrl/Cmd + Z</dt>
                    <dd>Undo</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + Y</dt>
                    <dd>Redo</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + S</dt>
                    <dd>Save diagram</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + P</dt>
                    <dd>Toggle properties</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + L</dt>
                    <dd>Auto-layout diagram</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + Tab</dt>
                    <dd>Next tab</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + Shift + Tab</dt>
                    <dd>Previous tab</dd>
                </div>
                <div>
                    <dt>Ctrl/Cmd + Q</dt>
                    <dd>Quit editor</dd>
                </div>
            </dl>
        </aside>
        <aside
            class="desktop-tab-chooser"
            id="desktop-tab-chooser"
            aria-label="Choose a linked diagram"
            hidden
        ></aside>
        <script type="module" src="./src/desktop-main.ts"></script>
    </body>
</html>
